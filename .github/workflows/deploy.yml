name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ipia-p2/package-lock.json

      - name: Install dependencies
        working-directory: ./ipia-p2
        run: npm ci

      - name: Build Angular app
        working-directory: ./ipia-p2
        run: npm run build -- --configuration production --base-href /WP_Projekat2/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ipia-p2/dist/ipia-p2/browser
