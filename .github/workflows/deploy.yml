name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ipia-p2/package-lock.json

      - name: Install dependencies
        working-directory: ./ipia-p2
        run: npm ci

      - name: Build Angular app
        working-directory: ./ipia-p2
        run: npm run build -- --configuration production --base-href /WP_2_Kenan_Babic/

      - name: List build output
        run: |
          echo "=== Listing dist directory ==="
          ls -la ./ipia-p2/dist/
          echo "=== Listing ipia-p2 directory ==="
          ls -la ./ipia-p2/dist/ipia-p2/ || echo "ipia-p2 folder not found"
          echo "=== Listing browser directory ==="
          ls -la ./ipia-p2/dist/ipia-p2/browser/ || echo "browser folder not found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ipia-p2/dist/ipia-p2/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
