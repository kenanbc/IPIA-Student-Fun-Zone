<div class="container">
    <div class="logo">
        <img src="Group 3.png" alt="">
    </div>
            <div class="login-container">
                <h2>Prijava</h2>
                <form (ngSubmit)="login()" id="loginForm">
                    <label for="email">E-mail</label>
                    <input type="text" [(ngModel)]="email" id="email" name="email" required placeholder="ime.prezime@ipi-akademija.ba"><br><br>

                    <label for="password">Lozinka:</label>
                    <input type="password" [(ngModel)]="password" id="password" name="password" required><br><br>
                    
                    @if(errorMessage){<p style="color: red; margin-top: 0;">{{ errorMessage }}</p>}
                    <div class="center-button"> <input type="submit" value="Prijava"></div>
                   
                </form>
                <p>Nemate nalog? <a [routerLink]="['/register']">Registrujte se ovdje</a></p>
            </div>
        </div>
