<div class="container">
            <div class="login-container">
                <h2>Registracija</h2>
                <form id="registerForm" (ngSubmit)="register()">
                    <label for="ime">Ime</label>
                    <input type="text" id="ime" name="ime" [(ngModel)]="firstName" required><br><br>

                    <label for="prezime">Prezime</label>
                    <input type="text" id="prezime" name="prezime" [(ngModel)]="lastName" required><br><br>
                    
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" [(ngModel)]="email" required placeholder="ime.prezime@ipi-akademija.ba"><br><br>

                    <label for="password">Lozinka:</label>
                    <input type="password" id="password" name="password" [(ngModel)]="password" required><br><br>

                    <label for="smjer">Smjer</label>
                    <select id="smjer" name="smjer" [(ngModel)]="studyProgram" required>
                        <option value="" disabled selected>Izaberite smjer</option>
                        <option value="1">Informatika i računarstvo</option>
                        <option value="2">Informacione tehnologije</option>
                        <option value="3">Tržišne komunikacije</option>
                        <option value="4">Savremeno poslovanje</option>
                    </select><br><br>

                    <label for="godina">Godina studija</label>
                    <select id="godina" name="godina" [(ngModel)]="yearOfStudy" required>
                        <option value="" disabled selected>Izaberite godinu studija</option>
                        <option value="1">Prva godina</option>
                        <option value="2">Druga godina</option>
                        <option value="3">Treća godina</option>
                        <option value="4">Četvrta godina</option>
                    </select><br><br>

                    <label for="avatar">Izaberite avatar:</label>
                    <div class="avatars"> 
                        @for(avatar of avatars; track avatar.id) {
                        <img src="{{avatar.path}}" alt="{{avatar.path}}" class="avatar-option" (click)="selectAvatar(avatar)" [class.selected]="selectedAvatar.id === avatar.id">
                        }
                    </div>

                    <div class="center-button"> <input type="submit" value="Prijava"></div>
                   
                </form>
                <p>Imate nalog? <a [routerLink]="['/login']">Prijavite se ovdje</a></p>
            </div>
        </div>
