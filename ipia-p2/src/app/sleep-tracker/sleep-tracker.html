<div class="tracker-page">
        <div>
            <a routerLink="/mytrackers" class="back-btn">Nazad</a>
            <div class="heading">
                <div>
                    <h1>San</h1>
                    <p class="tracker-description">Pratite dužinu svog sna tokom sedmice</p>
                </div>
           </div>
        </div>

        <app-stats-component [stats]="sleepStats()"></app-stats-component>

        <div class="section-card">
        <h2>Upisivanje sna</h2>
            <div class="input-group">
            <div class="input-field">
            <label>Vrijeme odlaska na spavanje</label>
            <input type="time" [(ngModel)]="bedTime">
            </div>
        <div class="input-field">
            <label>Vrijeme buđenja</label>
            <input type="time" [(ngModel)]="wakeTime">
        </div>
        </div>
            <button class="btn" (click)="saveSleep()">Sačuvaj podatke o snu</button>
    </div>

        <div class="week-sleep">
            <h2>Pregled sedmice</h2>
            @for (day of days; track $index) {
            <div class="days-sleep">
                <div class="day">
                    <p>{{day}}</p>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bar" [style.width.%]="getProgress($index)"></div>
                </div>
                <div class="hours">
                    <p>{{sleepService.weekData()[$index]}}h</p>
                </div>
            </div>}
    </div>
    </div>
