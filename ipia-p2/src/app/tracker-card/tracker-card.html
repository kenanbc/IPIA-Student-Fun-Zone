<a routerLink="/{{tracker.route}}" class="tracker-card">
    <div class="tracker-icon"><img src="{{tracker.icon}}"></div>
        <h2>{{tracker.name}}</h2>
        <p>{{tracker.description}}</p>
    <div class="tracker-last-used">
        <span class="last-used">Zadnji unos: {{tracker.lastUsed}}</span>
    </div>
</a>
