<h2>Interaktivni Whiteboard</h2>
    <div class="toolbar">
        <label for="colorPicker">Boja:</label>
        <input type="color" id="colorPicker" value="#345aaa">

        <label for="brushSize">Četka:</label>
        <input type="range" id="brushSize" min="1" max="20" value="3">

        <button id="eraserBtn" (click)="toggleEraser()">Briši</button>
        <button (click)="clearCanvas()">Čista ploča</button>
        <button (click)="saveImage()">Snimi</button>
        <button (click)="savePDF()">Snimi kao PDF</button>
        <button (click)="openEmailModal()">Pošalji mailom</button>
        <button routerLink="/studentfunzone" style="background-color: red;">Izlaz</button>
    </div>

    <canvas id="board" width="900" height="500"></canvas>

    <div id="emailModal" class="email-modal" (click)="onModalClick($event)">
      <div class="email-modal-content">
        <h3>Pošalji mailom</h3>
        <input type="email" id="emailInput" placeholder="Unesite email adresu..." />
        <div class="email-modal-buttons">
          <button (click)="sendEmail()" class="email-send-btn">Pošalji</button>
          <button (click)="closeEmailModal()" class="email-cancel-btn">Poništi</button>
        </div>
      </div>
    </div>
